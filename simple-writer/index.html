<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Simple Writer</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #202936;
      background: #f3f5f8;
      --border: #dce2e9;
      --muted: #667386;
      --blue: #234b7e;
      --blue-light: #eaf1fa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #76a4de; outline-offset: 2px; }
    .app-header {
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      min-height: 73px; padding: 13px max(20px, calc((100vw - 1300px) / 2));
      background: #fff; border-bottom: 1px solid var(--border);
    }
    .identity { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .identity-icon { display: grid; place-items: center; width: 34px; height: 34px; color: var(--blue); background: var(--blue-light); border-radius: 9px; }
    .app-name { font-size: 17px; font-weight: 700; letter-spacing: -.025em; }
    .doc-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 220px; }
    #documentName {
      min-width: 150px; width: min(100%, 360px); border: 1px solid transparent; border-radius: 6px;
      font-size: 15px; font-weight: 600; padding: 8px 9px; color: #202936; background: transparent;
    }
    #documentName:hover, #documentName:focus { border-color: var(--border); background: #f8fafc; outline-offset: 0; }
    .save-status { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .header-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .action-button {
      border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 9px 13px;
      color: #26374a; font-weight: 600; font-size: 13px;
    }
    .action-button:hover { background: #f3f7fc; }
    .action-button.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    .action-button.primary:hover { background: #193b67; }
    .toolbar-shell { background: #fff; border-bottom: 1px solid var(--border); }
    .toolbar {
      max-width: 1310px; margin: auto; padding: 10px 18px; display: flex; align-items: center;
      flex-wrap: wrap; column-gap: 7px; row-gap: 8px;
    }
    .toolbar-section { display: inline-flex; align-items: center; gap: 3px; padding-right: 10px; margin-right: 3px; border-right: 1px solid var(--border); }
    .toolbar-section:last-child { border-right: 0; padding-right: 0; }
    .toolbar-button {
      border: 1px solid transparent; border-radius: 6px; background: transparent; min-width: 35px; height: 35px;
      display: inline-flex; align-items: center; justify-content: center; padding: 0 8px;
      font-size: 15px; color: #334253;
    }
    .toolbar-button:hover { background: #eef3fa; }
    .toolbar-button.is-active { color: #153f73; background: #dfebfa; border-color: #c6dbf7; }
    .toolbar-button:disabled { cursor: not-allowed; opacity: .35; }
    .toolbar-select { border: 1px solid var(--border); color: #28394c; height: 35px; border-radius: 6px; background: #fff; padding: 0 7px; font-size: 13px; max-width: 150px; }
    #blockType { width: 132px; }
    #fontFamily { width: 128px; }
    #fontSize { width: 82px; }
    .color-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .color-wrap input[type=color] {
      position: absolute; width: 35px; height: 35px; opacity: 0; cursor: pointer;
    }
    .color-underline { display: block; height: 3px; width: 15px; margin-top: 1px; background: #26374a; border-radius: 1px; }
    .highlight-mark { width: 16px; height: 12px; background: #f7e68d; transform: skew(-9deg); display: block; border: 1px solid #e5ca50; }
    .workspace { padding: 30px 20px 42px; }
    .paper {
      width: 8.5in; min-height: 11in; max-width: 100%; margin: 0 auto;
      background: #fff; border: 1px solid #e1e4eb;
      box-shadow: 0 6px 22px rgba(26, 41, 61, .10); padding: .85in;
    }
    .editor {
      width: 100%; min-height: 9.15in; outline: none; background: white;
      font-family: Arial, sans-serif; font-size: 16px; line-height: 1.55;
      color: #202020; overflow-wrap: anywhere; white-space: normal;
    }
    .editor:empty::before { content: 'Start writing here...'; color: #94a0af; pointer-events: none; }
    .editor p { margin: 0 0 .85em; }
    .editor h1 { font-size: 1.7em; line-height: 1.25; margin: .1em 0 .55em; }
    .editor h2 { font-size: 1.35em; line-height: 1.3; margin: 1em 0 .5em; }
    .editor h3 { font-size: 1.15em; line-height: 1.35; margin: .9em 0 .5em; }
    .editor ul, .editor ol { padding-left: 1.6em; margin: 0 0 .85em; }
    .editor li { margin-bottom: .2em; }
    .editor blockquote { border-left: 3px solid #b8c5d6; padding-left: 16px; color: #506074; margin-left: 0; }
    .editor a { color: #1e5b9c; }
    .footer {
      max-width: 8.5in; margin: 12px auto 0; padding: 0 4px;
      color: #657387; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;
      font-size: 12px;
    }
    .footer kbd { font: inherit; padding: 2px 4px; border: 1px solid #d6dee8; border-radius: 3px; background: #fff; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    @media (max-width: 860px) {
      .app-header { gap: 8px; }
      .doc-info { order: 3; flex-basis: 100%; }
      .header-actions { margin-left: auto; }
      .workspace { padding: 16px 10px 28px; }
      .paper { padding: 28px 22px; min-height: 72vh; }
      .editor { min-height: 65vh; }
    }
    @media (max-width: 520px) {
      .toolbar { padding: 9px; }
      .toolbar-section { padding-right: 6px; margin-right: 0; }
      .app-header { padding: 10px; }
      .save-status { display: none; }
      .header-actions { gap: 4px; }
      .action-button { padding: 8px; }
      .footer .shortcut-hint { display: none; }
    }
    @media print {
      @page { size: letter; margin: .75in; }
      html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
      .app-header, .toolbar-shell, .footer { display: none !important; }
      .workspace { margin: 0 !important; padding: 0 !important; }
      .paper { width: auto !important; min-height: 0 !important; max-width: none !important; box-shadow: none !important; border: 0 !important; padding: 0 !important; margin: 0 !important; }
      .editor { min-height: 0 !important; outline: 0 !important; overflow: visible !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .editor:empty::before { display: none; }
      .editor p, .editor h1, .editor h2, .editor h3 { break-inside: avoid; }
      .editor ul, .editor ol { break-inside: auto; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="identity">
      <div class="identity-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4V21H7a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Z"/><path d="M14 3.5v4h4M9 12h6M9 16h6"/></svg>
      </div>
      <div class="app-name">Simple Writer</div>
    </div>
    <div class="doc-info">
      <label class="sr-only" for="documentName">Document name</label>
      <input id="documentName" type="text" value="Untitled document" autocomplete="off" spellcheck="false" maxlength="120">
      <span class="save-status" id="saveStatus" role="status" aria-live="polite">Ready</span>
    </div>
    <nav class="header-actions" aria-label="Document actions">
      <button type="button" class="action-button" id="newDocument" title="Start a new document">New</button>
      <button type="button" class="action-button" id="openDocument" title="Open a .html or .txt document">Open</button>
      <button type="button" class="action-button" id="saveDocument" title="Download an editable HTML document">Save</button>
      <button type="button" class="action-button primary" id="printDocument" title="Print or save as PDF (Ctrl+P)">Print</button>
    </nav>
  </header>

  <div class="toolbar-shell">
    <div class="toolbar" role="toolbar" aria-label="Text formatting">
      <div class="toolbar-section">
        <button type="button" class="toolbar-button" data-command="undo" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
        <button type="button" class="toolbar-button" data-command="redo" title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
      </div>
      <div class="toolbar-section">
        <label class="sr-only" for="blockType">Paragraph style</label>
        <select id="blockType" class="toolbar-select" aria-label="Paragraph style" title="Paragraph style">
          <option value="p">Normal text</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option>
        </select>
        <label class="sr-only" for="fontFamily">Font family</label>
        <select id="fontFamily" class="toolbar-select" aria-label="Font family" title="Font family">
          <option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option><option value="Verdana">Verdana</option><option value="Courier New">Courier New</option>
        </select>
        <label class="sr-only" for="fontSize">Font size</label>
        <select id="fontSize" class="toolbar-select" aria-label="Font size" title="Font size">
          <option value="2">Small</option><option value="3" selected>Normal</option><option value="4">Large</option><option value="5">X-large</option><option value="6">XX-large</option>
        </select>
      </div>
      <div class="toolbar-section">
        <button type="button" class="toolbar-button" data-command="bold" title="Bold (Ctrl+B)" aria-label="Bold"><strong>B</strong></button>
        <button type="button" class="toolbar-button" data-command="italic" title="Italic (Ctrl+I)" aria-label="Italic"><em>I</em></button>
        <button type="button" class="toolbar-button" data-command="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
        <button type="button" class="toolbar-button" data-command="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
      </div>
      <div class="toolbar-section">
        <label class="color-wrap" title="Text color">
          <span class="toolbar-button" aria-hidden="true"><span><strong>A</strong><span class="color-underline" id="textColorSwatch"></span></span></span>
          <input id="textColor" type="color" value="#26374a" aria-label="Text color">
        </label>
        <label class="color-wrap" title="Highlight color">
          <span class="toolbar-button" aria-hidden="true"><span class="highlight-mark"></span></span>
          <input id="highlightColor" type="color" value="#fff1a8" aria-label="Highlight color">
        </label>
        <button type="button" class="toolbar-button" data-command="removeFormat" title="Clear selected text formatting" aria-label="Clear formatting">Tx</button>
      </div>
      <div class="toolbar-section">
        <button type="button" class="toolbar-button" data-command="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">&#8226; &#9776;</button>
        <button type="button" class="toolbar-button" data-command="insertOrderedList" title="Numbered list" aria-label="Numbered list">1. &#9776;</button>
      </div>
      <div class="toolbar-section">
        <button type="button" class="toolbar-button" data-command="justifyLeft" title="Align left" aria-label="Align left">&#9776;</button>
        <button type="button" class="toolbar-button" data-command="justifyCenter" title="Center" aria-label="Center">&#8801;</button>
        <button type="button" class="toolbar-button" data-command="justifyRight" title="Align right" aria-label="Align right">&#9776;&#8594;</button>
        <button type="button" class="toolbar-button" id="insertLink" title="Add hyperlink" aria-label="Add hyperlink">&#128279;</button>
      </div>
    </div>
  </div>

  <main class="workspace">
    <div class="paper" aria-label="Letter-size document page">
      <div id="editor" class="editor" contenteditable="true" role="textbox" aria-label="Document content" aria-multiline="true" spellcheck="true"></div>
    </div>
    <div class="footer">
      <span id="wordCount">0 words · 0 characters</span>
      <span class="shortcut-hint">Tip: <kbd>Ctrl</kbd> + <kbd>B</kbd> for bold · <kbd>Ctrl</kbd> + <kbd>P</kbd> to print</span>
    </div>
  </main>
  <input id="fileInput" class="sr-only" type="file" accept=".html,.htm,.txt,text/html,text/plain" aria-label="Choose document to open">

  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'simple-writer-autosave-v1';
      const editor = document.getElementById('editor');
      const nameInput = document.getElementById('documentName');
      const status = document.getElementById('saveStatus');
      const wordCount = document.getElementById('wordCount');
      const blockType = document.getElementById('blockType');
      const fontFamily = document.getElementById('fontFamily');
      const fontSize = document.getElementById('fontSize');
      const textColor = document.getElementById('textColor');
      const highlightColor = document.getElementById('highlightColor');
      const fileInput = document.getElementById('fileInput');
      let savedRange = null;
      let saveTimer;
      let dirty = false;

      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (ch) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch]);
      function filename() {
        const base = nameInput.value.trim().replace(/[\\/:*?"<>|\x00-\x1F]/g, '-').replace(/\.+$/, '').trim().slice(0, 90);
        return base || 'Untitled document';
      }
      function updateCount() {
        const text = (editor.innerText || '').replace(/\u200B/g, '').trim();
        const count = text ? (text.match(/\S+/g) || []).length : 0;
        wordCount.textContent = `${count.toLocaleString()} ${count === 1 ? 'word' : 'words'} · ${text.length.toLocaleString()} characters`;
      }
      function localSave() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ title: nameInput.value, content: editor.innerHTML }));
          status.textContent = 'Saved in this browser';
          dirty = false;
        } catch (_) {
          status.textContent = 'Autosave unavailable — use Save';
        }
      }
      function changed() {
        dirty = true;
        status.textContent = 'Saving…';
        updateCount();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(localSave, 550);
      }
      function selectionInEditor() {
        const selection = window.getSelection();
        return selection && selection.rangeCount && editor.contains(selection.getRangeAt(0).commonAncestorContainer);
      }
      function rememberSelection() {
        if (selectionInEditor()) savedRange = window.getSelection().getRangeAt(0).cloneRange();
      }
      function restoreSelection() {
        editor.focus({ preventScroll: true });
        if (!savedRange) return;
        try {
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(savedRange);
        } catch (_) { savedRange = null; }
      }
      function runCommand(command, value = null) {
        restoreSelection();
        document.execCommand(command, false, value);
        rememberSelection();
        refreshToolbar();
        changed();
      }
      function refreshToolbar() {
        if (!selectionInEditor()) return;
        for (const button of document.querySelectorAll('[data-command]')) {
          const command = button.dataset.command;
          if (/^(bold|italic|underline|strikeThrough|insertUnorderedList|insertOrderedList|justifyLeft|justifyCenter|justifyRight)$/.test(command)) {
            try {
              const pressed = document.queryCommandState(command);
              button.classList.toggle('is-active', pressed);
              button.setAttribute('aria-pressed', String(pressed));
            } catch (_) { /* Unsupported state does not affect editing. */ }
          }
        }
        const selection = window.getSelection();
        if (!selection || !selection.rangeCount) return;
        let node = selection.anchorNode;
        if (node && node.nodeType === 3) node = node.parentElement;
        if (node && node.closest) {
          const block = node.closest('h1,h2,h3,blockquote,p');
          if (block && editor.contains(block)) blockType.value = block.tagName.toLowerCase();
          else blockType.value = 'p';
        }
      }
      document.addEventListener('selectionchange', () => { rememberSelection(); refreshToolbar(); });
      editor.addEventListener('input', changed);
      editor.addEventListener('keyup', rememberSelection);
      editor.addEventListener('mouseup', rememberSelection);
      nameInput.addEventListener('input', changed);
      document.querySelectorAll('.toolbar-button').forEach((button) => {
        // Keep the caret or highlighted text in place when a toolbar button is clicked.
        button.addEventListener('mousedown', (event) => event.preventDefault());
      });
      document.querySelectorAll('[data-command]').forEach((button) => {
        button.addEventListener('click', () => runCommand(button.dataset.command));
      });
      blockType.addEventListener('change', () => runCommand('formatBlock', `<${blockType.value}>`));
      fontFamily.addEventListener('change', () => runCommand('fontName', fontFamily.value));
      fontSize.addEventListener('change', () => runCommand('fontSize', fontSize.value));
      textColor.addEventListener('input', () => {
        document.getElementById('textColorSwatch').style.background = textColor.value;
        runCommand('foreColor', textColor.value);
      });
      highlightColor.addEventListener('input', () => runCommand('hiliteColor', highlightColor.value));

      function safeUrl(raw) {
        let url = (raw || '').trim();
        if (!url) return null;
        if (!/^[a-z][a-z\d+.-]*:/i.test(url)) url = 'https://' + url;
        try {
          const value = new URL(url);
          return ['https:', 'http:', 'mailto:'].includes(value.protocol) ? value.href : null;
        } catch (_) { return null; }
      }
      document.getElementById('insertLink').addEventListener('click', () => {
        const url = safeUrl(window.prompt('Enter a website address (https://...) or email address (mailto:):'));
        if (!url) return;
        restoreSelection();
        const selection = window.getSelection();
        if (selection && !selection.isCollapsed) document.execCommand('createLink', false, url);
        else document.execCommand('insertHTML', false, `<a href="${escapeHtml(url)}">${escapeHtml(url)}</a>`);
        rememberSelection();
        changed();
      });

      // Pasting as plain text avoids Word/website styles overriding the document.
      editor.addEventListener('paste', (event) => {
        const text = event.clipboardData && event.clipboardData.getData('text/plain');
        if (text == null) return;
        event.preventDefault();
        document.execCommand('insertText', false, text);
        changed();
      });
      editor.addEventListener('drop', (event) => {
        // Avoid unexpected external HTML/images in the document.
        if (event.dataTransfer && (event.dataTransfer.files.length || event.dataTransfer.types.includes('text/html'))) event.preventDefault();
      });

      const SAFE_TAGS = new Set(['P','BR','DIV','SPAN','B','STRONG','I','EM','U','S','STRIKE','FONT','H1','H2','H3','UL','OL','LI','BLOCKQUOTE','A','SUB','SUP']);
      const SAFE_STYLES = new Set(['color','background-color','font-family','font-size','font-weight','font-style','text-decoration','text-align','margin-left']);
      function cleanNode(node, output) {
        if (node.nodeType === Node.TEXT_NODE) { output.appendChild(document.createTextNode(node.textContent || '')); return; }
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (['SCRIPT','STYLE','IFRAME','OBJECT','SVG','FORM','META','LINK','TEMPLATE','NOSCRIPT','INPUT','BUTTON'].includes(node.tagName)) return;
        const allowed = SAFE_TAGS.has(node.tagName);
        const safe = allowed ? document.createElement(node.tagName.toLowerCase()) : document.createDocumentFragment();
        if (allowed) {
          if (node.tagName === 'A') {
            const url = safeUrl(node.getAttribute('href'));
            if (url) safe.setAttribute('href', url);
          }
          if (node.tagName === 'FONT') {
            for (const attr of ['face', 'size', 'color']) {
              const value = node.getAttribute(attr);
              if (value && value.length < 150 && !/[<>]/.test(value)) safe.setAttribute(attr, value);
            }
          }
          if (node.hasAttribute('style')) {
            const source = node.style;
            for (const property of SAFE_STYLES) {
              const value = source.getPropertyValue(property);
              if (value && value.length < 100 && !/url\s*\(|expression\s*\(|[<>]/i.test(value)) safe.style.setProperty(property, value);
            }
          }
          if (node.hasAttribute('align') && ['left','right','center','justify'].includes(node.getAttribute('align').toLowerCase())) {
            safe.style.textAlign = node.getAttribute('align').toLowerCase();
          }
        }
        for (const child of Array.from(node.childNodes)) cleanNode(child, safe);
        output.appendChild(safe);
      }
      function sanitizeHtml(html) {
        const parsed = new DOMParser().parseFromString(`<body>${html}</body>`, 'text/html');
        const clean = document.createElement('div');
        for (const node of Array.from(parsed.body.childNodes)) cleanNode(node, clean);
        return clean.innerHTML;
      }
      function textToHtml(text) {
        const normalized = text.replace(/\r\n?/g, '\n');
        return normalized.split(/\n\n+/).map((paragraph) => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>') || '<br>'}</p>`).join('');
      }
      function download(name, content, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = name;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      document.getElementById('saveDocument').addEventListener('click', () => {
        const title = filename();
        const safeBody = sanitizeHtml(editor.innerHTML);
        const html = `<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>${escapeHtml(title)}</title>\n<style>body{max-width:7in;margin:45px auto;padding:0 20px;font:16px/1.55 Arial,sans-serif;color:#202020}h1{line-height:1.25}h2{line-height:1.3}p{margin:0 0 .85em}@media print{@page{size:letter;margin:.75in}body{max-width:none;margin:0;padding:0}}</style>\n</head>\n<body>\n<div id="simple-writer-document">${safeBody}</div>\n</body>\n</html>\n`;
        download(`${title}.html`, html, 'text/html;charset=utf-8');
        localSave();
        status.textContent = 'HTML document downloaded';
      });
      document.getElementById('printDocument').addEventListener('click', () => {
        localSave();
        window.print();
      });
      document.getElementById('newDocument').addEventListener('click', () => {
        const nonempty = (editor.innerText || '').trim().length > 0;
        if (nonempty && !window.confirm('Start a new document? Save a copy of your current document first if you want to keep it.')) return;
        nameInput.value = 'Untitled document';
        editor.innerHTML = '';
        savedRange = null;
        for (const button of document.querySelectorAll('.toolbar-button.is-active')) button.classList.remove('is-active');
        blockType.value = 'p';
        changed();
        localSave();
        editor.focus();
      });
      document.getElementById('openDocument').addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        fileInput.value = '';
        const nonempty = (editor.innerText || '').trim().length > 0;
        if (nonempty && !window.confirm('Open this file and replace your current document? Save your current document first if needed.')) return;
        try {
          const content = await file.text();
          const isHtml = /\.html?$/i.test(file.name) || /html/i.test(file.type);
          if (isHtml) {
            const doc = new DOMParser().parseFromString(content, 'text/html');
            const part = doc.getElementById('simple-writer-document') || doc.body;
            editor.innerHTML = sanitizeHtml(part.innerHTML);
            nameInput.value = (doc.title || file.name.replace(/\.html?$/i, '')).slice(0, 120);
          } else {
            editor.innerHTML = textToHtml(content);
            nameInput.value = file.name.replace(/\.txt$/i, '').slice(0, 120);
          }
          savedRange = null;
          changed();
          localSave();
          editor.focus();
        } catch (error) {
          window.alert('Could not open this document. Please choose an HTML or plain text file.');
        }
      });
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (stored && typeof stored.title === 'string' && typeof stored.content === 'string') {
          nameInput.value = stored.title;
          editor.innerHTML = sanitizeHtml(stored.content);
          status.textContent = 'Restored from this browser';
        }
      } catch (_) { status.textContent = 'Ready — local autosave unavailable'; }
      updateCount();
      window.addEventListener('beforeunload', () => { if (dirty) localSave(); });
    })();
  </script>
</body>
</html>
